<!--
사용 방법
1) 현재 첨부한 calendar_v20_manday_project_click_removed_fixed.html 파일을 그대로 유지합니다.
2) 아래 블록 전체를 기존 파일의 마지막 </body> 바로 위에 추가합니다.
3) 같은 기능을 다시 선언하는 방식이라 기존 로직을 최대한 유지하면서 안정성만 보강합니다.
-->

<style>
  body.modal-open,
  body.drawer-open,
  body.detail-open {
    overflow: hidden;
    touch-action: none;
  }

  .modal[role="dialog"],
  .detail-panel[role="dialog"] {
    outline: none;
  }

  .sidebar-overlay.show,
  .detail-overlay.show,
  .modal-bg.show {
    backdrop-filter: blur(1px);
  }
</style>

<script>
(function(){
  function id(v){ return document.getElementById(v); }
  function q(sel){ return document.querySelector(sel); }
  function qa(sel){ return Array.from(document.querySelectorAll(sel)); }
  function isMobile(){ return window.innerWidth <= 680; }
  function hasShow(el){ return !!(el && el.classList && el.classList.contains('show')); }
  function safeFocus(el){
    if(!el) return;
    const target = el.querySelector('input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), select:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if(target && typeof target.focus === 'function') {
      requestAnimationFrame(() => {
        try { target.focus({ preventScroll:true }); } catch(_) { try { target.focus(); } catch(__) {} }
      });
    }
  }

  const modalEl = id('modal');
  const modalBox = modalEl ? modalEl.querySelector('.modal') : null;
  const sidebarEl = q('.sidebar');
  const sidebarOverlayEl = id('sidebar-overlay');
  const detailEl = id('detail-panel');
  const detailOverlayEl = id('detail-overlay');

  let lastFocusedEl = null;

  function rememberFocus(){
    const active = document.activeElement;
    if(active && active instanceof HTMLElement) lastFocusedEl = active;
  }

  function restoreFocus(){
    if(lastFocusedEl && document.contains(lastFocusedEl)) {
      requestAnimationFrame(() => {
        try { lastFocusedEl.focus({ preventScroll:true }); } catch(_) { try { lastFocusedEl.focus(); } catch(__) {} }
      });
    }
  }

  function syncBodyState(){
    const modalOpen = hasShow(modalEl);
    const detailOpen = hasShow(detailEl);
    const drawerOpen = !!(isMobile() && sidebarEl && sidebarEl.classList.contains('show'));

    document.body.classList.toggle('modal-open', modalOpen);
    document.body.classList.toggle('detail-open', detailOpen);
    document.body.classList.toggle('drawer-open', drawerOpen);
  }

  if(modalEl){
    modalEl.setAttribute('role', 'dialog');
    modalEl.setAttribute('aria-modal', 'true');
    modalEl.setAttribute('aria-hidden', 'true');
  }
  if(detailEl){
    detailEl.setAttribute('role', 'dialog');
    detailEl.setAttribute('aria-modal', 'true');
    detailEl.setAttribute('aria-hidden', 'true');
  }

  if(modalBox){
    modalBox.addEventListener('click', function(e){ e.stopPropagation(); });
  }
  if(detailEl){
    detailEl.addEventListener('click', function(e){ e.stopPropagation(); });
  }
  if(sidebarOverlayEl){
    sidebarOverlayEl.addEventListener('click', function(){
      if(typeof window.toggleSidebar === 'function') window.toggleSidebar(false);
    });
  }

  const prevOpenModal = window.openModal;
  window.openModal = function(title){
    rememberFocus();
    if(typeof prevOpenModal === 'function') prevOpenModal(title);
    else {
      const titleEl = id('modal-title');
      if(titleEl) titleEl.textContent = title || '';
      if(modalEl) modalEl.classList.add('show');
    }
    if(modalEl) modalEl.setAttribute('aria-hidden', 'false');
    syncBodyState();
    safeFocus(modalEl);
  };

  const prevCloseModal = window.closeModal;
  window.closeModal = function(){
    if(typeof prevCloseModal === 'function') prevCloseModal();
    else if(modalEl) {
      modalEl.classList.remove('show');
    }
    if(modalEl) modalEl.setAttribute('aria-hidden', 'true');
    syncBodyState();
    restoreFocus();
  };

  const prevOpenDetailPanel = window.openDetailPanel;
  window.openDetailPanel = function(title, subtitle, bodyHtml, targetType, targetId){
    rememberFocus();
    if(typeof prevOpenDetailPanel === 'function') prevOpenDetailPanel(title, subtitle, bodyHtml, targetType, targetId);
    if(detailEl){
      detailEl.dataset.targetType = targetType || '';
      detailEl.dataset.targetId = targetId || '';
      detailEl.setAttribute('aria-hidden', 'false');
    }
    if(detailOverlayEl) detailOverlayEl.setAttribute('aria-hidden', 'false');
    syncBodyState();
    safeFocus(detailEl);
  };

  const prevCloseDetailPanel = window.closeDetailPanel;
  window.closeDetailPanel = function(){
    if(typeof prevCloseDetailPanel === 'function') prevCloseDetailPanel();
    else {
      if(detailOverlayEl) detailOverlayEl.classList.remove('show');
      if(detailEl) detailEl.classList.remove('show');
    }
    if(detailEl){
      detailEl.setAttribute('aria-hidden', 'true');
      detailEl.dataset.targetType = '';
      detailEl.dataset.targetId = '';
    }
    if(detailOverlayEl) detailOverlayEl.setAttribute('aria-hidden', 'true');
    syncBodyState();
    restoreFocus();
  };

  const prevToggleSidebar = window.toggleSidebar;
  window.toggleSidebar = function(forceState){
    if(!sidebarEl || !sidebarOverlayEl) return;

    let nextOpen;
    if(typeof forceState === 'boolean') nextOpen = forceState;
    else nextOpen = !sidebarEl.classList.contains('show');

    if(typeof prevToggleSidebar === 'function' && typeof forceState !== 'boolean') {
      try {
        prevToggleSidebar();
        nextOpen = sidebarEl.classList.contains('show');
      } catch(_) {
        sidebarEl.classList.toggle('show', nextOpen);
        sidebarOverlayEl.classList.toggle('show', nextOpen);
      }
    } else {
      sidebarEl.classList.toggle('show', nextOpen);
      sidebarOverlayEl.classList.toggle('show', nextOpen);
    }

    sidebarEl.classList.toggle('show', nextOpen);
    sidebarOverlayEl.classList.toggle('show', nextOpen);
    syncBodyState();
  };

  const prevGoPage = window.goPage;
  window.goPage = function(pageId){
    if(typeof prevGoPage === 'function') prevGoPage(pageId);
    if(isMobile() && typeof window.toggleSidebar === 'function') window.toggleSidebar(false);
    syncBodyState();
  };

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;

    if(hasShow(modalEl)) {
      e.preventDefault();
      window.closeModal();
      return;
    }

    if(hasShow(detailEl)) {
      e.preventDefault();
      window.closeDetailPanel();
      return;
    }

    if(isMobile() && sidebarEl && sidebarEl.classList.contains('show')) {
      e.preventDefault();
      window.toggleSidebar(false);
    }
  }, true);

  document.addEventListener('keydown', function(e){
    const target = e.target;
    if(!target) return;

    if(target.id === 'detail-comment-input' && e.key === 'Enter' && !e.shiftKey) {
      const targetType = detailEl ? detailEl.dataset.targetType : '';
      const targetId = detailEl ? detailEl.dataset.targetId : '';
      if(targetType && targetId && typeof window.addComment === 'function') {
        e.preventDefault();
        window.addComment(targetType, targetId);
      }
    }
  }, true);

  window.addEventListener('resize', syncBodyState);
  window.addEventListener('pageshow', syncBodyState);

  qa('button, .btn, .chip, .sb-btn, .quick-card').forEach(function(el){
    if(!el.getAttribute('type') && el.tagName === 'BUTTON') {
      el.setAttribute('type', 'button');
    }
  });

  syncBodyState();
})();
</script>
