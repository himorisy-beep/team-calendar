<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캘린더</title>
  <link rel="icon" href="data:," />
  <style>
    :root, html[data-theme="light"] {
      --bg:#fff; --bg2:#f7f7f5; --bg3:#f0efe9; --text:#1a1a1a; --text2:#6b6b6b; --text3:#a8a8a8;
      --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.16); --r:10px; --r-sm:6px;
      --accent:#2563EB; --success:#0F6E56; --danger:#D85A30;
    }
    html[data-theme="dark"] {
      --bg:#1c1c1c; --bg2:#242424; --bg3:#2a2a28; --text:#f0efe9; --text2:#9a9a94; --text3:#606060;
      --border:rgba(255,255,255,0.09); --border2:rgba(255,255,255,0.16);
      --accent:#5DA0FF; --success:#49D2A6; --danger:#FF8F6B;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg:#1c1c1c; --bg2:#242424; --bg3:#2a2a28; --text:#f0efe9; --text2:#9a9a94; --text3:#606060;
        --border:rgba(255,255,255,0.09); --border2:rgba(255,255,255,0.16);
        --accent:#5DA0FF; --success:#49D2A6; --danger:#FF8F6B;
      }
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
    body.modal-open, body.drawer-open{overflow:hidden}
    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer}
    input,select,textarea{width:100%;padding:9px 10px;border:.5px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font-size:13px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
    textarea{min-height:96px;resize:vertical}

    .layout{display:flex;min-height:100vh}
    .mobile-header{display:none;padding:14px 20px;background:var(--bg);border-bottom:.5px solid var(--border);align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:100}
    .menu-btn{background:none;border:none;font-size:22px;color:var(--text);padding:0;line-height:1}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:150}
    .sidebar-overlay.show{display:block}
    .sidebar{width:220px;background:var(--bg);border-right:.5px solid var(--border);padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:20px;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;z-index:120}
    .logo{font-size:15px;font-weight:700;padding:0 6px}
    .logo-sub{font-size:12px;color:var(--text3);font-weight:400;margin-top:2px;padding:0 6px}
    .sb-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding:0 6px;margin-bottom:6px}
    .filter-section{border-top:.5px solid var(--border);padding-top:8px}
    .sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:none;background:none;color:var(--text2);font-size:13px;border-radius:var(--r-sm);text-align:left;transition:all .12s}
    .sb-btn:hover{background:var(--bg2);color:var(--text)}
    .sb-btn.active{background:var(--bg3);color:var(--text);font-weight:500}
    .sb-btn .icon{font-size:14px;width:18px;text-align:center}

    .main{flex:1;padding:24px;overflow:auto;min-width:0;margin-left:220px;width:calc(100% - 220px)}
    .page{display:none}.page.active{display:block}
    .page-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap;justify-content:space-between}
    .page-title{font-size:20px;font-weight:800;white-space:nowrap}
    .page-sub{font-size:13px;color:var(--text2);line-height:1.5;margin-top:4px}
    .overview-actions,.head-actions{margin-left:auto;display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}

    .card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px}
    .card-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
    .btn{padding:8px 14px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;border:none;font-family:inherit;transition:opacity .12s;white-space:nowrap}
    .btn-primary{background:var(--text);color:var(--bg)}
    .btn-primary:hover{opacity:.82}
    .btn-secondary{background:none;color:var(--text);border:.5px solid var(--border2)}
    .btn-secondary:hover{background:var(--bg2)}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-danger-sm{padding:4px 8px;background:none;color:#A32D2D;border:.5px solid #F09595;border-radius:var(--r-sm);font-size:11px;cursor:pointer;font-family:inherit}
    .chip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:.5px solid var(--border2);background:var(--bg);color:var(--text2);transition:all .12s}
    .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
    .tag{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
    .tag-todo{background:#F1EFE8;color:#5F5E5A}.tag-doing{background:#E6F1FB;color:#185FA5}.tag-done{background:#E1F5EE;color:#0F6E56}
    .tag-event{background:#EEEDFE;color:#3C3489}.tag-proposal{background:#FAECE7;color:#D85A30}.tag-subtle{background:#F1EFE8;color:#5F5E5A}

    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .form-row.full{grid-template-columns:1fr}
    .fl{font-size:11px;color:var(--text2);margin-bottom:4px}
    .help{font-size:11px;color:var(--text3);line-height:1.45;margin-top:5px}
    .empty{padding:1.2rem;text-align:center;color:var(--text3);font-size:13px;border:.5px dashed var(--border2);border-radius:var(--r-sm)}

    .home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .home-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:16px}
    .home-label{font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase}
    .home-value{font-size:24px;font-weight:900}
    .home-sub{font-size:12px;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
    .list-wrap{display:flex;flex-direction:column;gap:7px}
    .li{display:flex;gap:11px;padding:11px 14px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);align-items:flex-start;cursor:pointer;transition:border-color .12s}
    .li:hover{border-color:var(--border2)}
    .li-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
    .li-info{flex:1;min-width:0}
    .li-title{font-size:14px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .li-meta{font-size:12px;color:var(--text2);line-height:1.45}
    .li.is-past{opacity:.55;filter:grayscale(.8)}
    .tag-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

    .calendar-shell{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);overflow:hidden}
    .calendar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:.5px solid var(--border)}
    .month-title{font-size:18px;font-weight:900}
    .cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
    .cal-head{background:var(--bg2)}
    .cal-head div{padding:8px 4px;text-align:center;font-size:11px;color:var(--text2);font-weight:700;border-right:.5px solid var(--border)}
    .cal-head div:last-child{border-right:none}
    .cal-grid{gap:1px;background:var(--border)}
    .cal-day{background:var(--bg);min-height:106px;padding:6px;cursor:pointer;transition:background .1s;min-width:0}
    .cal-day:hover{background:var(--bg2)}
    .cal-day.other{background:var(--bg2);color:var(--text3)}
    .cal-day.today .dn{background:var(--text);color:var(--bg);border-radius:50%}
    .dn{font-size:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
    .ep{font-size:11px;padding:3px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;background:#EEEDFE;color:#3C3489}
    .ep.deadline{background:#FAECE7;color:#D85A30}

    .project-table-wrap{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);overflow:auto}
    .project-table{width:100%;border-collapse:collapse;min-width:820px}
    .project-table th{font-size:11px;color:var(--text3);text-align:left;padding:10px 12px;background:var(--bg2);border-bottom:.5px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
    .project-table td{font-size:13px;padding:11px 12px;border-bottom:.5px solid var(--border);vertical-align:middle}
    .project-table tr:last-child td{border-bottom:none}
    .avatar-stack{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
    .av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;background:var(--bg2);color:var(--text)}
    .member-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:12px;border:.5px solid var(--border);background:var(--bg2)}

    .member-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .member-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);overflow:hidden}
    .member-card-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--border)}
    .member-card-info{flex:1}
    .member-card-name{font-size:14px;font-weight:600}
    .member-card-role{font-size:12px;color:var(--text2)}
    .member-card-body{padding:12px 16px}

    .participant-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .participant-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--bg2);border:.5px solid var(--border);font-size:12px}
    .participant-chip button{border:none;background:none;color:var(--text2);font-size:12px;padding:0;line-height:1}
    .participant-box{border:.5px solid var(--border);border-radius:var(--r-sm);padding:10px;background:var(--bg2)}

    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:200;align-items:center;justify-content:center;padding:20px}
    .modal-bg.show{display:flex}
    .modal{background:var(--bg);border-radius:var(--r);padding:22px;width:760px;max-width:96vw;border:.5px solid var(--border2);max-height:88vh;overflow-y:auto}
    .modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px}
    .modal-title{font-size:16px;font-weight:800}
    .modal-sub{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.45}
    .modal-close{border:none;background:none;cursor:pointer;color:var(--text2);font-size:18px;line-height:1}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}

    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 22px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;z-index:300;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}

    @media(max-width:1000px){
      .home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .overview-grid{grid-template-columns:1fr}
      .member-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:680px){
      .sidebar{position:fixed;left:-260px;z-index:200;width:240px;transition:left .25s ease;box-shadow:2px 0 10px rgba(0,0,0,.1)}
      .sidebar.show{left:0}
      .main{padding:0;margin-left:0;width:100%}
      .page{padding:16px}
      .mobile-header{display:flex}
      .home-grid{grid-template-columns:1fr}
      .member-grid{grid-template-columns:1fr}
      .form-row{grid-template-columns:1fr}
      .modal-bg{padding:12px}
      .modal{padding:18px;max-height:calc(100vh - 24px)}
    }
  </style>
</head>
<body>
  <header class="mobile-header">
    <button class="menu-btn" id="menu-btn" type="button">☰</button>
    <div style="font-weight:700">캘린더</div>
    <button class="btn btn-secondary btn-sm" id="theme-btn-mobile" type="button">테마</button>
  </header>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="logo">캘린더 워크스페이스</div>
        <div class="logo-sub">일정 · 사업 · 참여인력 관리</div>
      </div>

      <div class="filter-section">
        <div class="sb-label">Navigation</div>
        <button class="sb-btn active" data-page="home" type="button"><span class="icon">⌂</span><span>홈</span></button>
        <button class="sb-btn" data-page="calendar" type="button"><span class="icon">🗓</span><span>캘린더</span></button>
        <button class="sb-btn" data-page="business" type="button"><span class="icon">▣</span><span>사업관리</span></button>
        <button class="sb-btn" data-page="members" type="button"><span class="icon">👥</span><span>참여인력</span></button>
      </div>

      <div class="filter-section">
        <div class="sb-label">Quick Action</div>
        <button class="sb-btn" id="quick-add-event" type="button"><span class="icon">＋</span><span>일정 추가</span></button>
        <button class="sb-btn" id="quick-add-project" type="button"><span class="icon">＋</span><span>사업 추가</span></button>
        <button class="sb-btn" id="quick-add-member" type="button"><span class="icon">＋</span><span>인력 추가</span></button>
      </div>

      <div class="filter-section">
        <div class="sb-label">Preference</div>
        <button class="sb-btn" id="theme-btn" type="button"><span class="icon">◐</span><span>테마 전환</span></button>
        <button class="sb-btn" id="reset-btn" type="button"><span class="icon">↺</span><span>샘플 데이터 초기화</span></button>
      </div>
    </aside>

    <main class="main">
      <section class="page active" id="page-home">
        <div class="page-header">
          <div>
            <div class="page-title">홈</div>
            <div class="page-sub">오늘 일정과 사업 진행상황을 한눈에 확인합니다.</div>
          </div>
          <div class="head-actions">
            <button class="btn btn-secondary" id="go-today-btn" type="button">오늘로 이동</button>
            <button class="btn btn-primary" id="home-add-event-btn" type="button">일정 추가</button>
          </div>
        </div>

        <div class="card" style="padding:12px 14px" id="today-alert"></div>
        <div class="home-grid" id="home-metrics"></div>
        <div class="overview-grid">
          <div class="card">
            <div class="card-title">오늘 일정</div>
            <div class="list-wrap" id="today-events"></div>
          </div>
          <div class="card">
            <div class="card-title">다가오는 사업 마감</div>
            <div class="list-wrap" id="upcoming-projects"></div>
          </div>
        </div>
      </section>

      <section class="page" id="page-calendar">
        <div class="page-header">
          <div>
            <div class="page-title">캘린더</div>
            <div class="page-sub">일정과 사업 마감일을 월 단위로 관리합니다.</div>
          </div>
          <div class="head-actions">
            <button class="btn btn-secondary" id="prev-month-btn" type="button">이전</button>
            <button class="btn btn-secondary" id="next-month-btn" type="button">다음</button>
            <button class="btn btn-primary" id="add-event-btn" type="button">일정 추가</button>
          </div>
        </div>

        <div class="calendar-shell">
          <div class="calendar-top">
            <div class="month-title" id="month-title"></div>
            <div class="tag tag-subtle">일정 + 사업 마감</div>
          </div>
          <div class="cal-head">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
          </div>
          <div class="cal-grid" id="calendar-grid"></div>
        </div>
      </section>

      <section class="page" id="page-business">
        <div class="page-header">
          <div>
            <div class="page-title">사업관리</div>
            <div class="page-sub">사업 수정 안에서 참여인력까지 함께 편집하도록 단순화했습니다.</div>
          </div>
          <div class="head-actions">
            <div id="project-filter-row" style="display:flex;gap:6px;flex-wrap:wrap"></div>
            <button class="btn btn-primary" id="add-project-btn" type="button">사업 추가</button>
          </div>
        </div>

        <div class="project-table-wrap">
          <table class="project-table">
            <thead>
              <tr>
                <th>사업명</th>
                <th>상태</th>
                <th>기간</th>
                <th>참여인력</th>
                <th>설명</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="project-table-body"></tbody>
          </table>
        </div>
      </section>

      <section class="page" id="page-members">
        <div class="page-header">
          <div>
            <div class="page-title">참여인력</div>
            <div class="page-sub">사업별 참여인력을 관리합니다.</div>
          </div>
          <div class="head-actions">
            <button class="btn btn-primary" id="add-member-btn" type="button">인력 추가</button>
          </div>
        </div>
        <div class="member-grid" id="member-grid"></div>
      </section>
    </main>
  </div>

  <div class="modal-bg" id="modal-bg" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1">
      <div class="modal-hdr">
        <div>
          <div class="modal-title" id="modal-title">모달</div>
          <div class="modal-sub" id="modal-sub"></div>
        </div>
        <button class="modal-close" id="modal-close-btn" type="button">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'calendar-full-replacement-integrated-v1';
      const THEME_KEY = 'calendar-full-replacement-theme';

      const qs = (s, r = document) => r.querySelector(s);
      const qsa = (s, r = document) => Array.from(r.querySelectorAll(s));
      const byId = (id) => document.getElementById(id);

      const state = {
        page: 'home',
        monthCursor: startOfMonth(new Date()),
        projectFilter: 'all',
        editingEventId: null,
        editingProjectId: null,
        editingMemberId: null,
        projectMemberDraft: []
      };

      let data = loadData();
      applyTheme(localStorage.getItem(THEME_KEY) || 'auto');

      const refs = {
        sidebar: byId('sidebar'),
        overlay: byId('sidebar-overlay'),
        modalBg: byId('modal-bg'),
        modal: byId('modal'),
        modalTitle: byId('modal-title'),
        modalSub: byId('modal-sub'),
        modalBody: byId('modal-body'),
        toast: byId('toast')
      };

      bindEvents();
      renderAll();

      function bindEvents(){
        qsa('.sb-btn[data-page]').forEach(btn => btn.addEventListener('click', () => goPage(btn.dataset.page)));
        byId('menu-btn').addEventListener('click', () => toggleSidebar());
        refs.overlay.addEventListener('click', () => toggleSidebar(false));
        byId('theme-btn').addEventListener('click', toggleTheme);
        byId('theme-btn-mobile').addEventListener('click', toggleTheme);
        byId('reset-btn').addEventListener('click', resetData);

        byId('quick-add-event').addEventListener('click', () => openEventModal());
        byId('quick-add-project').addEventListener('click', () => openProjectModal());
        byId('quick-add-member').addEventListener('click', () => openMemberModal());

        byId('home-add-event-btn').addEventListener('click', () => openEventModal());
        byId('go-today-btn').addEventListener('click', () => {
          state.monthCursor = startOfMonth(new Date());
          goPage('calendar');
          renderCalendar();
        });
        byId('prev-month-btn').addEventListener('click', () => {
          state.monthCursor = addMonths(state.monthCursor, -1);
          renderCalendar();
        });
        byId('next-month-btn').addEventListener('click', () => {
          state.monthCursor = addMonths(state.monthCursor, 1);
          renderCalendar();
        });
        byId('add-event-btn').addEventListener('click', () => openEventModal());
        byId('add-project-btn').addEventListener('click', () => openProjectModal());
        byId('add-member-btn').addEventListener('click', () => openMemberModal());

        byId('modal-close-btn').addEventListener('click', closeModal);
        refs.modalBg.addEventListener('click', (e) => {
          if(e.target === refs.modalBg) closeModal();
        });

        document.addEventListener('keydown', (e) => {
          if(e.key !== 'Escape') return;
          if(refs.modalBg.classList.contains('show')) {
            closeModal();
            return;
          }
          if(window.innerWidth <= 680 && refs.sidebar.classList.contains('show')) {
            toggleSidebar(false);
          }
        });
      }

      function loadData(){
        try{
          const raw = localStorage.getItem(STORAGE_KEY);
          if(raw){
            const parsed = JSON.parse(raw);
            if(parsed && Array.isArray(parsed.events) && Array.isArray(parsed.projects) && Array.isArray(parsed.members)) return parsed;
          }
        }catch(err){ console.warn(err); }
        return seedData();
      }

      function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

      function applyTheme(theme){
        if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
        else if(theme === 'light') document.documentElement.setAttribute('data-theme','light');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem(THEME_KEY, theme);
      }

      function toggleTheme(){
        const current = localStorage.getItem(THEME_KEY) || 'auto';
        applyTheme(current === 'auto' ? 'light' : current === 'light' ? 'dark' : 'auto');
        showToast('테마를 변경했습니다');
      }

      function resetData(){
        if(!confirm('샘플 데이터로 초기화할까요?')) return;
        data = seedData();
        saveData();
        renderAll();
        showToast('초기화되었습니다');
      }

      function renderAll(){
        renderNav();
        renderHome();
        renderCalendar();
        renderProjectFilter();
        renderBusiness();
        renderMembers();
      }

      function renderNav(){
        qsa('.sb-btn[data-page]').forEach(btn => btn.classList.toggle('active', btn.dataset.page === state.page));
        qsa('.page').forEach(page => page.classList.toggle('active', page.id === `page-${state.page}`));
      }

      function goPage(page){
        state.page = page;
        renderNav();
        if(window.innerWidth <= 680) toggleSidebar(false);
      }

      function toggleSidebar(force){
        const next = typeof force === 'boolean' ? force : !refs.sidebar.classList.contains('show');
        refs.sidebar.classList.toggle('show', next);
        refs.overlay.classList.toggle('show', next);
        document.body.classList.toggle('drawer-open', next);
      }

      function renderHome(){
        const today = formatDateInput(new Date());
        const todayEvents = [...data.events].filter(e => e.date === today).sort((a,b) => (a.time || '').localeCompare(b.time || ''));
        const activeProjects = data.projects.filter(p => p.status === 'doing');
        const upcomingProjects = [...data.projects].filter(p => p.endDate).sort((a,b) => a.endDate.localeCompare(b.endDate)).slice(0,5);

        byId('today-alert').innerHTML = todayEvents.length
          ? `<strong>오늘 일정</strong><span style="margin-left:6px;color:var(--text2)">${todayEvents.length}건이 예정되어 있습니다.</span>`
          : `<strong>오늘 일정</strong><span style="margin-left:6px;color:var(--text2)">예정된 일정이 없습니다.</span>`;

        const metrics = [
          { label:'총 사업', value:data.projects.length, sub:`${activeProjects.length}개 진행 중` },
          { label:'총 일정', value:data.events.length, sub:`오늘 ${todayEvents.length}건` },
          { label:'참여인력', value:data.members.length, sub:`배정 인력 ${getAssignedMemberIds().length}명` },
          { label:'이번달 마감', value:countCurrentMonthDeadlines(), sub:'종료일 기준' }
        ];
        byId('home-metrics').innerHTML = metrics.map(m => `
          <div class="home-card">
            <div class="home-label">${escapeHtml(m.label)}</div>
            <div class="home-value">${m.value}</div>
            <div class="home-sub">${escapeHtml(m.sub)}</div>
          </div>
        `).join('');

        renderList(byId('today-events'), todayEvents.map(e => ({
          title:e.title,
          meta:[formatDateDisplay(e.date), e.time || '시간 미정', e.category].filter(Boolean).join(' · '),
          dot:e.color || '#2563EB',
          tags:[e.category ? { text:e.category, cls:'event' } : null].filter(Boolean),
          past:isPastDateTime(e.date, e.time)
        })), '오늘 일정이 없습니다.');

        renderList(byId('upcoming-projects'), upcomingProjects.map(p => ({
          title:p.name,
          meta:`${formatDateDisplay(p.startDate)} ~ ${formatDateDisplay(p.endDate)} · ${statusLabel(p.status)}`,
          dot:p.color || '#3B6D11',
          tags:[{ text:statusLabel(p.status), cls:p.status }],
          past:!!p.endDate && p.endDate < today
        })), '다가오는 사업 마감이 없습니다.');
      }

      function renderCalendar(){
        byId('month-title').textContent = `${state.monthCursor.getFullYear()}년 ${state.monthCursor.getMonth()+1}월`;
        const first = startOfMonth(state.monthCursor);
        const start = addDays(first, -first.getDay());
        const cells = [];

        for(let i=0;i<42;i++){
          const day = addDays(start, i);
          const dateKey = formatDateInput(day);
          const isOther = day.getMonth() !== state.monthCursor.getMonth();
          const isToday = dateKey === formatDateInput(new Date());
          const items = getCalendarItems(dateKey);
          cells.push(`
            <div class="cal-day ${isOther ? 'other' : ''} ${isToday ? 'today' : ''}" data-date="${dateKey}">
              <div class="dn">${day.getDate()}</div>
              ${items.slice(0,3).map(item => `<div class="ep ${item.type === 'deadline' ? 'deadline' : ''}">${escapeHtml(item.title)}</div>`).join('')}
              ${items.length > 3 ? `<div class="ep">+${items.length - 3} more</div>` : ''}
            </div>
          `);
        }

        byId('calendar-grid').innerHTML = cells.join('');
        qsa('.cal-day', byId('calendar-grid')).forEach(el => {
          el.addEventListener('click', () => openEventModal({ date: el.dataset.date }));
        });
      }

      function getCalendarItems(dateKey){
        const events = data.events.filter(e => e.date === dateKey).map(e => ({ title:e.title, type:'event' }));
        const deadlines = data.projects.filter(p => p.endDate === dateKey).map(p => ({ title:`${p.name} 마감`, type:'deadline' }));
        return [...events, ...deadlines];
      }

      function renderProjectFilter(){
        const filters = [
          { value:'all', label:'전체' },
          { value:'todo', label:'준비' },
          { value:'doing', label:'진행 중' },
          { value:'done', label:'완료' }
        ];
        const row = byId('project-filter-row');
        row.innerHTML = filters.map(f => `<button class="chip ${state.projectFilter === f.value ? 'active' : ''}" data-filter="${f.value}" type="button">${f.label}</button>`).join('');
        qsa('[data-filter]', row).forEach(btn => btn.addEventListener('click', () => {
          state.projectFilter = btn.dataset.filter;
          renderProjectFilter();
          renderBusiness();
        }));
      }

      function renderBusiness(){
        const list = getFilteredProjects();
        const tbody = byId('project-table-body');
        if(!list.length){
          tbody.innerHTML = `<tr><td colspan="6"><div class="empty">표시할 사업이 없습니다.</div></td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(p => `
          <tr>
            <td><strong>${escapeHtml(p.name)}</strong></td>
            <td><span class="tag tag-${escapeHtml(p.status)}">${escapeHtml(statusLabel(p.status))}</span></td>
            <td>${escapeHtml(formatDateDisplay(p.startDate))} ~ ${escapeHtml(formatDateDisplay(p.endDate))}</td>
            <td>${renderMemberTags(p.memberIds)}</td>
            <td>${escapeHtml(trimText(p.description || '', 44))}</td>
            <td>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <button class="btn btn-secondary btn-sm" type="button" data-edit-project="${p.id}">수정</button>
                <button class="btn-danger-sm" type="button" data-delete-project="${p.id}">삭제</button>
              </div>
            </td>
          </tr>
        `).join('');

        qsa('[data-edit-project]').forEach(btn => btn.addEventListener('click', () => openProjectModal(findProject(btn.dataset.editProject))));
        qsa('[data-delete-project]').forEach(btn => btn.addEventListener('click', () => deleteProject(btn.dataset.deleteProject)));
      }

      function renderMembers(){
        const wrap = byId('member-grid');
        if(!data.members.length){
          wrap.innerHTML = `<div class="empty">참여인력이 없습니다.</div>`;
          return;
        }

        wrap.innerHTML = data.members.map(m => {
          const projects = data.projects.filter(p => (p.memberIds || []).includes(m.id));
          return `
            <div class="member-card">
              <div class="member-card-header">
                <div class="av" style="width:30px;height:30px;font-size:12px">${escapeHtml(initials(m.name))}</div>
                <div class="member-card-info">
                  <div class="member-card-name">${escapeHtml(m.name)}</div>
                  <div class="member-card-role">${escapeHtml(m.role || '역할 미지정')}</div>
                </div>
              </div>
              <div class="member-card-body">
                <div class="help" style="margin:0 0 10px">${escapeHtml(m.email || '이메일 없음')}</div>
                <div class="participant-list" style="margin-bottom:10px">
                  ${projects.length ? projects.map(p => `<span class="participant-chip">${escapeHtml(p.name)}</span>`).join('') : '<span class="tag tag-subtle">배정된 사업 없음</span>'}
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <button class="btn btn-secondary btn-sm" type="button" data-edit-member="${m.id}">수정</button>
                  <button class="btn-danger-sm" type="button" data-delete-member="${m.id}">삭제</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        qsa('[data-edit-member]').forEach(btn => btn.addEventListener('click', () => openMemberModal(findMember(btn.dataset.editMember))));
        qsa('[data-delete-member]').forEach(btn => btn.addEventListener('click', () => deleteMember(btn.dataset.deleteMember)));
      }

      function renderList(container, items, emptyText){
        if(!items.length){
          container.innerHTML = `<div class="empty">${escapeHtml(emptyText)}</div>`;
          return;
        }
        container.innerHTML = items.map(item => `
          <div class="li ${item.past ? 'is-past' : ''}">
            <span class="li-dot" style="background:${escapeAttr(item.dot || '#2563EB')}"></span>
            <div class="li-info">
              <div class="li-title">${escapeHtml(item.title)}</div>
              <div class="li-meta">${escapeHtml(item.meta || '')}</div>
              ${item.tags?.length ? `<div class="tag-row">${item.tags.map(tag => `<span class="tag tag-${tag.cls}">${escapeHtml(tag.text)}</span>`).join('')}</div>` : ''}
            </div>
          </div>
        `).join('');
      }

      function openModal(title, sub, html){
        refs.modalTitle.textContent = title;
        refs.modalSub.textContent = sub || '';
        refs.modalBody.innerHTML = html;
        refs.modalBg.classList.add('show');
        refs.modalBg.setAttribute('aria-hidden','false');
        document.body.classList.add('modal-open');
        requestAnimationFrame(() => {
          const first = refs.modal.querySelector('input, select, textarea, button');
          if(first) first.focus();
        });
      }

      function closeModal(){
        refs.modalBg.classList.remove('show');
        refs.modalBg.setAttribute('aria-hidden','true');
        refs.modalBody.innerHTML = '';
        document.body.classList.remove('modal-open');
        state.editingEventId = null;
        state.editingProjectId = null;
        state.editingMemberId = null;
        state.projectMemberDraft = [];
      }

      function openEventModal(prefill){
        const item = prefill && prefill.id ? prefill : null;
        state.editingEventId = item ? item.id : null;
        openModal(item ? '일정 수정' : '일정 추가', '캘린더 일정을 입력합니다.', `
          <form id="event-form">
            <div class="form-row full">
              <div><div class="fl">일정명</div><input id="event-title" value="${escapeAttr(item?.title || '')}" required></div>
            </div>
            <div class="form-row">
              <div><div class="fl">날짜</div><input id="event-date" type="date" value="${escapeAttr(item?.date || prefill?.date || formatDateInput(new Date()))}" required></div>
              <div><div class="fl">시간</div><input id="event-time" type="time" value="${escapeAttr(item?.time || '')}"></div>
            </div>
            <div class="form-row">
              <div>
                <div class="fl">분류</div>
                <select id="event-category">
                  ${['일정','회의','출장','개인'].map(v => `<option value="${v}" ${item?.category === v ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>
              <div><div class="fl">색상</div><input id="event-color" type="color" value="${escapeAttr(item?.color || '#2563EB')}"></div>
            </div>
            <div class="form-row full">
              <div><div class="fl">메모</div><textarea id="event-note">${escapeHtml(item?.note || '')}</textarea></div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" type="button" id="event-cancel-btn">취소</button>
              <button class="btn btn-primary" type="submit">저장</button>
            </div>
          </form>
        `);
        byId('event-cancel-btn').addEventListener('click', closeModal);
        byId('event-form').addEventListener('submit', submitEvent);
      }

      function submitEvent(e){
        e.preventDefault();
        const payload = {
          id: state.editingEventId || uid('evt'),
          title: byId('event-title').value.trim(),
          date: byId('event-date').value,
          time: byId('event-time').value,
          category: byId('event-category').value,
          color: byId('event-color').value,
          note: byId('event-note').value.trim()
        };
        if(!payload.title || !payload.date){ showToast('일정명과 날짜를 입력해주세요'); return; }
        upsertById(data.events, payload);
        saveData();
        closeModal();
        renderAll();
        showToast(state.editingEventId ? '일정을 수정했습니다' : '일정을 추가했습니다');
      }

      function openProjectModal(project){
        state.editingProjectId = project ? project.id : null;
        state.projectMemberDraft = [...(project?.memberIds || [])];
        openModal(project ? '사업 수정' : '사업 추가', '사업 정보와 참여인력을 같은 화면에서 수정합니다.', `
          <form id="project-form">
            <div class="form-row full">
              <div><div class="fl">사업명</div><input id="project-name" value="${escapeAttr(project?.name || '')}" required></div>
            </div>
            <div class="form-row">
              <div>
                <div class="fl">상태</div>
                <select id="project-status">
                  <option value="todo" ${project?.status === 'todo' ? 'selected' : ''}>준비</option>
                  <option value="doing" ${!project || project?.status === 'doing' ? 'selected' : ''}>진행 중</option>
                  <option value="done" ${project?.status === 'done' ? 'selected' : ''}>완료</option>
                </select>
              </div>
              <div><div class="fl">색상</div><input id="project-color" type="color" value="${escapeAttr(project?.color || '#3B6D11')}"></div>
            </div>
            <div class="form-row">
              <div><div class="fl">시작일</div><input id="project-start" type="date" value="${escapeAttr(project?.startDate || formatDateInput(new Date()))}"></div>
              <div><div class="fl">종료일</div><input id="project-end" type="date" value="${escapeAttr(project?.endDate || '')}"></div>
            </div>
            <div class="form-row full">
              <div><div class="fl">설명</div><textarea id="project-description">${escapeHtml(project?.description || '')}</textarea></div>
            </div>
            <div class="form-row full">
              <div>
                <div class="fl">참여인력</div>
                <div class="participant-box">
                  <div class="participant-list" id="participant-list"></div>
                  <div class="form-row" style="margin-top:0">
                    <div>
                      <div class="fl">추가할 팀원</div>
                      <select id="participant-select">
                        <option value="">팀원 선택</option>
                        ${data.members.map(m => `<option value="${m.id}">${escapeHtml(m.name)}${m.role ? ` · ${escapeHtml(m.role)}` : ''}</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <div class="fl">&nbsp;</div>
                      <button class="btn btn-secondary" id="participant-add-btn" type="button" style="width:100%">참여인력 추가</button>
                    </div>
                  </div>
                  <div class="help">기존처럼 별도 참여인력 버튼으로 나누지 않고, 수정 안에서 함께 저장됩니다.</div>
                </div>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" type="button" id="project-cancel-btn">취소</button>
              <button class="btn btn-primary" type="submit">저장</button>
            </div>
          </form>
        `);
        renderParticipantDraft();
        byId('participant-add-btn').addEventListener('click', addDraftParticipant);
        byId('project-cancel-btn').addEventListener('click', closeModal);
        byId('project-form').addEventListener('submit', submitProject);
      }

      function renderParticipantDraft(){
        const wrap = byId('participant-list');
        if(!wrap) return;
        if(!state.projectMemberDraft.length){
          wrap.innerHTML = '<div class="empty" style="width:100%">참여인력이 없습니다.</div>';
          return;
        }
        wrap.innerHTML = state.projectMemberDraft.map(id => {
          const m = findMember(id);
          if(!m) return '';
          return `
            <span class="participant-chip">
              ${escapeHtml(m.name)}${m.role ? ` · ${escapeHtml(m.role)}` : ''}
              <button type="button" data-remove-participant="${m.id}">✕</button>
            </span>
          `;
        }).join('');
        qsa('[data-remove-participant]', wrap).forEach(btn => btn.addEventListener('click', () => {
          state.projectMemberDraft = state.projectMemberDraft.filter(id => id !== btn.dataset.removeParticipant);
          renderParticipantDraft();
        }));
      }

      function addDraftParticipant(){
        const select = byId('participant-select');
        const memberId = select.value;
        if(!memberId) return;
        if(state.projectMemberDraft.includes(memberId)){
          showToast('이미 추가된 참여인력입니다');
          return;
        }
        state.projectMemberDraft.push(memberId);
        select.value = '';
        renderParticipantDraft();
      }

      function submitProject(e){
        e.preventDefault();
        const payload = {
          id: state.editingProjectId || uid('prj'),
          name: byId('project-name').value.trim(),
          status: byId('project-status').value,
          color: byId('project-color').value,
          startDate: byId('project-start').value,
          endDate: byId('project-end').value,
          description: byId('project-description').value.trim(),
          memberIds: [...state.projectMemberDraft]
        };
        if(!payload.name){ showToast('사업명을 입력해주세요'); return; }
        if(payload.startDate && payload.endDate && payload.startDate > payload.endDate){ showToast('종료일은 시작일보다 빠를 수 없습니다'); return; }
        upsertById(data.projects, payload);
        saveData();
        closeModal();
        renderAll();
        showToast(state.editingProjectId ? '사업을 수정했습니다' : '사업을 추가했습니다');
      }

      function deleteProject(id){
        const p = findProject(id);
        if(!p) return;
        if(!confirm(`'${p.name}' 사업을 삭제할까요?`)) return;
        data.projects = data.projects.filter(v => v.id !== id);
        saveData();
        renderAll();
        showToast('사업을 삭제했습니다');
      }

      function openMemberModal(member){
        state.editingMemberId = member ? member.id : null;
        openModal(member ? '참여인력 수정' : '참여인력 추가', '인력 정보를 입력합니다.', `
          <form id="member-form">
            <div class="form-row">
              <div><div class="fl">이름</div><input id="member-name" value="${escapeAttr(member?.name || '')}" required></div>
              <div><div class="fl">역할</div><input id="member-role" value="${escapeAttr(member?.role || '')}"></div>
            </div>
            <div class="form-row full">
              <div><div class="fl">이메일</div><input id="member-email" type="email" value="${escapeAttr(member?.email || '')}"></div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" type="button" id="member-cancel-btn">취소</button>
              <button class="btn btn-primary" type="submit">저장</button>
            </div>
          </form>
        `);
        byId('member-cancel-btn').addEventListener('click', closeModal);
        byId('member-form').addEventListener('submit', submitMember);
      }

      function submitMember(e){
        e.preventDefault();
        const payload = {
          id: state.editingMemberId || uid('mem'),
          name: byId('member-name').value.trim(),
          role: byId('member-role').value.trim(),
          email: byId('member-email').value.trim()
        };
        if(!payload.name){ showToast('이름을 입력해주세요'); return; }
        upsertById(data.members, payload);
        saveData();
        closeModal();
        renderAll();
        showToast(state.editingMemberId ? '참여인력을 수정했습니다' : '참여인력을 추가했습니다');
      }

      function deleteMember(id){
        const m = findMember(id);
        if(!m) return;
        if(!confirm(`'${m.name}' 참여인력을 삭제할까요?`)) return;
        data.members = data.members.filter(v => v.id !== id);
        data.projects = data.projects.map(p => ({ ...p, memberIds:(p.memberIds || []).filter(mid => mid !== id) }));
        saveData();
        renderAll();
        showToast('참여인력을 삭제했습니다');
      }

      function getFilteredProjects(){
        return [...data.projects]
          .filter(p => state.projectFilter === 'all' ? true : p.status === state.projectFilter)
          .sort((a,b) => (a.endDate || '').localeCompare(b.endDate || ''));
      }

      function renderMemberTags(memberIds){
        const members = (memberIds || []).map(findMember).filter(Boolean);
        if(!members.length) return '<span class="tag tag-subtle">참여인력 없음</span>';
        return `<div class="avatar-stack">${members.map(m => `<span class="member-tag"><span class="av">${escapeHtml(initials(m.name))}</span>${escapeHtml(m.name)}</span>`).join('')}</div>`;
      }

      function findProject(id){ return data.projects.find(p => p.id === id) || null; }
      function findMember(id){ return data.members.find(m => m.id === id) || null; }
      function getAssignedMemberIds(){ return [...new Set(data.projects.flatMap(p => p.memberIds || []))]; }
      function countCurrentMonthDeadlines(){
        const y = state.monthCursor.getFullYear();
        const m = state.monthCursor.getMonth();
        return data.projects.filter(p => {
          if(!p.endDate) return false;
          const d = new Date(`${p.endDate}T00:00:00`);
          return d.getFullYear() === y && d.getMonth() === m;
        }).length;
      }

      function upsertById(arr, item){
        const idx = arr.findIndex(v => v.id === item.id);
        if(idx >= 0) arr[idx] = item;
        else arr.push(item);
      }

      function showToast(message){
        refs.toast.textContent = message;
        refs.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => refs.toast.classList.remove('show'), 2200);
      }

      function statusLabel(status){
        if(status === 'doing') return '진행 중';
        if(status === 'done') return '완료';
        return '준비';
      }

      function trimText(text, len){ return text.length > len ? `${text.slice(0, len)}…` : text; }
      function formatDateDisplay(value){
        if(!value) return '미정';
        const d = new Date(`${value}T00:00:00`);
        if(Number.isNaN(d.getTime())) return value;
        return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      }
      function formatDateInput(date){
        const y = date.getFullYear();
        const m = String(date.getMonth()+1).padStart(2,'0');
        const d = String(date.getDate()).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }
      function startOfMonth(date){ return new Date(date.getFullYear(), date.getMonth(), 1); }
      function addMonths(date, amount){ return new Date(date.getFullYear(), date.getMonth() + amount, 1); }
      function addDays(date, amount){ const next = new Date(date); next.setDate(next.getDate() + amount); return next; }
      function isPastDateTime(dateValue, timeValue){ if(!dateValue) return false; return new Date(`${dateValue}T${timeValue || '23:59'}:00`).getTime() < Date.now(); }
      function initials(name){ return (name || '?').trim().slice(0,2).toUpperCase() || '?'; }
      function uid(prefix){ return `${prefix}_${Math.random().toString(36).slice(2,10)}`; }
      function escapeHtml(value){ return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
      function escapeAttr(value){ return escapeHtml(value); }
